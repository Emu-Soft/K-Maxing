name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Steal banner simulation
        run: lua5.1 tests/steal_sim.lua K-Maxing/Maxing_Core.lua
      - name: Dungeon lockdown simulation
        run: lua5.1 tests/lockdown_sim.lua K-Maxing/Maxing_Core.lua
      - name: Fake user command simulation
        run: lua5.1 tests/fake_user_sim.lua K-Maxing/Maxing_Core.lua
